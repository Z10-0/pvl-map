<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Выбор места на карте</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  #bar, #foot { display: flex; gap: 8px; padding: 8px; align-items: center; }
  #q { flex: 1; padding: 9px; font-size: 16px; border: 1px solid #aaa; border-radius: 8px; min-width: 0; }
  #wrap { position: relative; flex: 1; min-width: 0; display: flex; }
  #sug { position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; margin-top: 4px;
         background: var(--tg-theme-bg-color, #fff); border: 1px solid #bbb; border-radius: 8px;
         max-height: 45vh; overflow-y: auto; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #sug div { padding: 10px 12px; border-bottom: 1px solid rgba(128,128,128,.2); font-size: 15px; }
  #sug div:last-child { border-bottom: 0; }
  button { padding: 9px 14px; font-size: 16px; border: 0; border-radius: 8px; background: #2481cc; color: #fff; }
  button[disabled] { background: #9aa5ad; }
  #map { flex: 1; min-height: 0; }
  #info { flex: 1; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="bar"><div id="wrap"><input id="q" placeholder="Начните вводить адрес: Ло…" autocomplete="off"><div id="sug"></div></div><button id="go">Найти</button></div>
<div id="map"></div>
<div id="foot"><div id="info">Нажмите на карту, чтобы поставить метку</div><button id="ok" disabled>Готово</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Ключ Geoapify: вставьте свой между кавычками. Пусто — подсказки от OpenStreetMap.
const GEOAPIFY_KEY = "";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// начальное место можно передать в ссылке: ?lat=52.28&lng=76.96 (при смене места у существующей точки)
const params = new URLSearchParams(location.search);
const startLat = parseFloat(params.get("lat"));
const startLng = parseFloat(params.get("lng"));
const hasStart = Number.isFinite(startLat) && Number.isFinite(startLng);

const map = L.map("map").setView(hasStart ? [startLat, startLng] : [52.2873, 76.9674], hasStart ? 17 : 13); // по умолчанию Павлодар
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);

const info = document.getElementById("info");
const ok = document.getElementById("ok");
let marker = null;

function show(ll) {
  info.textContent = "Метка: " + ll.lat.toFixed(5) + ", " + ll.lng.toFixed(5) + " (можно перетащить)";
  ok.disabled = false;
}
function setPoint(ll) {
  if (marker) {
    marker.setLatLng(ll);
  } else {
    marker = L.marker(ll, { draggable: true }).addTo(map);
    marker.on("dragend", () => show(marker.getLatLng()));
  }
  show(ll);
}
map.on("click", (e) => setPoint(e.latlng));
if (hasStart) setPoint(L.latLng(startLat, startLng));

// подсказки адресов, как в навигаторе: Photon (бесплатный поиск по данным OpenStreetMap)
const sug = document.getElementById("sug");
const qbox = document.getElementById("q");
let timer = null;
let lastQuery = "";

function hideSug() { sug.style.display = "none"; sug.innerHTML = ""; }

function renderSug(items) {
  sug.innerHTML = "";
  if (!items.length) return hideSug();
  for (const it of items) {
    const row = document.createElement("div");
    row.textContent = it.label;
    row.onclick = () => {
      qbox.value = it.label;
      hideSug();
      map.setView([it.lat, it.lng], 18);
      setPoint(L.latLng(it.lat, it.lng)); // метку можно подвинуть
    };
    sug.appendChild(row);
  }
  sug.style.display = "block";
}

async function suggest(q) {
  const c = map.getCenter();
  const box = [c.lng - 0.45, c.lat + 0.3, c.lng + 0.45, c.lat - 0.3];
  const url = GEOAPIFY_KEY
    ? "https://api.geoapify.com/v1/geocode/autocomplete?format=json&lang=ru&limit=8&type=amenity,building,street" +
      "&filter=rect:" + box.join(",") + "&bias=proximity:" + c.lng + "," + c.lat +
      "&text=" + encodeURIComponent(q) + "&apiKey=" + GEOAPIFY_KEY
    : "https://photon.komoot.io/api/?lang=ru&limit=8&zoom=12&location_bias_scale=1&lat=" + c.lat + "&lon=" + c.lng +
      "&q=" + encodeURIComponent(q);
  try {
    const r = await (await fetch(url)).json();
    const items = [];
    const seen = new Set();
    const rows = GEOAPIFY_KEY
      ? (r.results || []).map((x) => ({ street: x.street || x.name, house: x.housenumber, district: x.district, lat: x.lat, lng: x.lon }))
      : (r.features || []).map((f) => ({
          street: f.properties?.street || f.properties?.name, house: f.properties?.housenumber,
          district: f.properties?.district, lat: f.geometry?.coordinates?.[1], lng: f.geometry?.coordinates?.[0],
        }));
    for (const x of rows) {
      if (x.lat == null || !x.street) continue;
      if (Math.hypot((x.lat - c.lat) * 111, (x.lng - c.lng) * 111 * Math.cos(c.lat * Math.PI / 180)) > 45) continue;
      const label = [x.street, x.house].filter(Boolean).join(" ") + (x.district ? ", " + x.district : "");
      if (seen.has(label)) continue;
      seen.add(label);
      items.push({ label, lat: x.lat, lng: x.lng });
      if (items.length >= 6) break;
    }
    if (qbox.value.trim() === q) renderSug(items);
  } catch (e) {
    info.textContent = "Подсказки недоступны: двигайте карту и нажмите на нужное место";
  }
}

qbox.addEventListener("input", () => {
  const q = qbox.value.trim();
  clearTimeout(timer);
  if (q.length < 2) return hideSug();
  timer = setTimeout(() => { if (q !== lastQuery) { lastQuery = q; suggest(q); } }, 300);
});
qbox.addEventListener("blur", () => setTimeout(hideSug, 200));
map.on("click", hideSug);

function search() { const q = qbox.value.trim(); if (q) suggest(q); }

document.getElementById("go").onclick = search;
qbox.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(); } });

// «Готово»: координаты уходят боту, окно закрывается
ok.onclick = () => {
  if (!marker) return;
  const ll = marker.getLatLng();
  const data = JSON.stringify({ lat: Number(ll.lat.toFixed(6)), lng: Number(ll.lng.toFixed(6)) });
  if (tg) tg.sendData(data);
  else alert("Откройте эту страницу из бота: " + data);
};
</script>
</body>
</html>
