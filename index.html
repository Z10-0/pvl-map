<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Выбор места на карте</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  #bar, #foot { display: flex; gap: 8px; padding: 8px; align-items: center; }
  #wrap { position: relative; flex: 1; min-width: 0; display: flex; }
  #q { flex: 1; padding: 9px; font-size: 16px; border: 1px solid #aaa; border-radius: 8px; min-width: 0; }
  #sug { position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; margin-top: 4px;
         background: var(--tg-theme-bg-color, #fff); border: 1px solid #bbb; border-radius: 8px;
         max-height: 45vh; overflow-y: auto; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #sug div { padding: 10px 12px; border-bottom: 1px solid rgba(128,128,128,.2); font-size: 15px; }
  #sug div:last-child { border-bottom: 0; }
  button { padding: 9px 14px; font-size: 16px; border: 0; border-radius: 8px; background: #2481cc; color: #fff; }
  button[disabled] { background: #9aa5ad; }
  #map { flex: 1; min-height: 0; }
  #info { flex: 1; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="bar"><div id="wrap"><input id="q" placeholder="Начните вводить адрес: Ло…" autocomplete="off"><div id="sug"></div></div><button id="go">Найти</button></div>
<div id="map"></div>
<div id="foot"><div id="info">Нажмите на карту, чтобы поставить метку</div><button id="ok" disabled>Готово</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
// Ключ Geoapify: вставьте свой между кавычками. Пусто — карта и подсказки от OpenStreetMap.
const GEOAPIFY_KEY = "2de8425afaee4c11a9fc749894083c24";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// начальное место передаётся в ссылке: ?lat=52.28&lng=76.96 (&view=1 — только посмотреть)
const params = new URLSearchParams(location.search);
const startLat = parseFloat(params.get("lat"));
const startLng = parseFloat(params.get("lng"));
const hasStart = Number.isFinite(startLat) && Number.isFinite(startLng);
const viewOnly = params.get("view") === "1";
const start = hasStart ? [startLng, startLat] : [76.9674, 52.2873]; // по умолчанию Павлодар

// Векторная карта: подписи можно перевести на русский (у растровой они «вшиты» в картинку)
const style = GEOAPIFY_KEY
  ? "https://maps.geoapify.com/v1/styles/osm-bright/style.json?apiKey=" + GEOAPIFY_KEY
  : {
      version: 8,
      sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, attribution: "© OpenStreetMap" } },
      layers: [{ id: "osm", type: "raster", source: "osm" }],
    };

const map = new maplibregl.Map({ container: "map", style, center: start, zoom: hasStart ? 16 : 12 });
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

// подписи на русском, где они есть; иначе остаётся местное название
function localize() {
  if (!GEOAPIFY_KEY) return;
  for (const layer of map.getStyle().layers || []) {
    if (layer.type !== "symbol") continue;
    if (!map.getLayoutProperty(layer.id, "text-field")) continue;
    try {
      map.setLayoutProperty(layer.id, "text-field", ["coalesce", ["get", "name:ru"], ["get", "name"], ["get", "name:kk"]]);
    } catch (e) {
      /* слой без названий — пропускаем */
    }
  }
}
map.on("load", localize);

const info = document.getElementById("info");
const ok = document.getElementById("ok");
const qbox = document.getElementById("q");
const sug = document.getElementById("sug");
let marker = null;

const hideSug = () => { sug.style.display = "none"; sug.innerHTML = ""; };

function show(ll) {
  info.textContent = "Метка: " + ll.lat.toFixed(5) + ", " + ll.lng.toFixed(5) + " (можно перетащить)";
  ok.disabled = false;
}
function setPoint(lng, lat) {
  if (marker) {
    marker.setLngLat([lng, lat]);
  } else {
    marker = new maplibregl.Marker({ draggable: !viewOnly, color: "#e23b3b" }).setLngLat([lng, lat]).addTo(map);
    marker.on("dragend", () => show(marker.getLngLat()));
  }
  show(marker.getLngLat());
}
if (!viewOnly) map.on("click", (e) => { hideSug(); setPoint(e.lngLat.lng, e.lngLat.lat); });
if (hasStart) setPoint(start[0], start[1]);

// ---------- подсказки адресов ----------
let timer = null;
let lastQuery = "";

function renderSug(items) {
  sug.innerHTML = "";
  if (!items.length) return hideSug();
  for (const it of items) {
    const row = document.createElement("div");
    row.textContent = it.label;
    row.onclick = () => {
      qbox.value = it.label;
      hideSug();
      map.flyTo({ center: [it.lng, it.lat], zoom: 17 });
      setPoint(it.lng, it.lat);
    };
    sug.appendChild(row);
  }
  sug.style.display = "block";
}

async function suggest(q) {
  const c = map.getCenter();
  const url = GEOAPIFY_KEY
    ? "https://api.geoapify.com/v1/geocode/autocomplete?format=json&lang=ru&limit=8" +
      "&filter=circle:" + c.lng + "," + c.lat + ",25000&bias=proximity:" + c.lng + "," + c.lat +
      "&text=" + encodeURIComponent(q) + "&apiKey=" + GEOAPIFY_KEY
    : "https://photon.komoot.io/api/?limit=8&zoom=12&location_bias_scale=1&lat=" + c.lat + "&lon=" + c.lng +
      "&q=" + encodeURIComponent(q);
  try {
    const r = await (await fetch(url)).json();
    const rows = GEOAPIFY_KEY
      ? (r.results || []).map(function (x) { return { street: x.street || x.name, house: x.housenumber, district: x.district, lat: x.lat, lng: x.lon }; })
      : (r.features || []).map(function (f) {
          const p = f.properties || {};
          const g = f.geometry && f.geometry.coordinates;
          return { street: p.street || p.name, house: p.housenumber, district: p.district, lat: g && g[1], lng: g && g[0] };
        });
    const items = [];
    const seen = new Set();
    for (const x of rows) {
      if (x.lat == null || !x.street) continue;
      if (Math.hypot((x.lat - c.lat) * 111, (x.lng - c.lng) * 111 * Math.cos((c.lat * Math.PI) / 180)) > 45) continue;
      const label = [x.street, x.house].filter(Boolean).join(" ") + (x.district ? ", " + x.district : "");
      if (seen.has(label)) continue;
      seen.add(label);
      items.push({ label: label, lat: x.lat, lng: x.lng });
      if (items.length >= 6) break;
    }
    if (qbox.value.trim() === q) renderSug(items);
  } catch (e) {
    info.textContent = "Подсказки недоступны: двигайте карту и нажмите на нужное место";
  }
}

qbox.addEventListener("input", () => {
  const q = qbox.value.trim();
  clearTimeout(timer);
  if (q.length < 2) return hideSug();
  timer = setTimeout(() => { if (q !== lastQuery) { lastQuery = q; suggest(q); } }, 300);
});
qbox.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const q = qbox.value.trim(); if (q) suggest(q); } });
qbox.addEventListener("blur", () => setTimeout(hideSug, 200));
document.getElementById("go").onclick = () => { const q = qbox.value.trim(); if (q) suggest(q); };

if (viewOnly) {
  document.getElementById("bar").style.display = "none";
  ok.style.display = "none";
  info.textContent = "Это место на карте";
}

// «Готово»: координаты уходят боту, окно закрывается
ok.onclick = () => {
  if (!marker) return;
  const ll = marker.getLngLat();
  const data = JSON.stringify({ lat: Number(ll.lat.toFixed(6)), lng: Number(ll.lng.toFixed(6)) });
  if (tg) tg.sendData(data);
  else alert("Откройте эту страницу из бота: " + data);
};
</script>
</body>
</html>
